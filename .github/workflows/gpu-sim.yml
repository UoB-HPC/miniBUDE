name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the CUDA and Thrust/CUDA models and runs the `solution` ctest case (bm1, 1024
# poses, energies checked against the deck) on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements real-GPU testing and
# does not replace it.

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "src/main.cpp"
      - "src/bude.h"
      - "src/cuda/**"
      - "src/thrust/**"
      - "data/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  solution:
    name: ${{ matrix.model }} (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The cuda model passes CUDA_ARCH to nvcc as `-arch=` and strips `sm_`
          # for CMAKE_CUDA_ARCHITECTURES: sm_90 embeds PTX, which the simulator
          # runs.
          - model: cuda
            cmake_args: -DMODEL=cuda -DCUDA_ARCH=sm_90
          # The thrust model hands CUDA_ARCH to CMAKE_CUDA_ARCHITECTURES as is,
          # and 90-virtual embeds PTX only.
          - model: cuda-thrust
            cmake_args: -DMODEL=thrust -DTHRUST_IMPL=CUDA -DBACKEND=CUDA -DCUDA_ARCH=90-virtual -DSDK_DIR=/usr/local/cuda-13.0/targets/x86_64-linux/lib/cmake

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # The simulator needs a shared CUDA runtime.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.0/bin/nvcc \
            -DCUDA_EXTRA_FLAGS="-cudart shared" \
            ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build -j3

      - name: Test
        run: vgpu run ctest --test-dir build --output-on-failure --no-tests=error -L solution
